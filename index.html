    <!--FORM-->
    <form>
        <label>ENTER YR NAME</label>
        <input type="text" placeholder="WRITE UR NAME"
         required

        <label>ENTER YR EMAIL</label>

        <label>ENTER YR PASSWORD</label>
        <input type="password" placeholder="WRITE UR PASSWORD" required />
        <br />
        <label>ENTER YR MOBILE NO</label>
        <input type="number" placeholder="WRITE UR MOBILE NO" 
        required
        min ="1000000"
        max="1000000000000000"/>
        <label>Choose your course</label>
        <select>
            <option value="">Select your Course </option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="Js">Javascript</option>
        </select>
        <br/>
        <label>Upload your CV</label>
        <input type="file" accept=".pdf" required/>
        <br/>
        <label>Upload your Qualification details</label>
        <input type="file" multiple required/>
        <button type="submit">SUBMIT</button>
        <button type="reset">RESET</button>


    </form>
